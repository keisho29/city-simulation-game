<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ダッシュランナー</title>
  </head>
  <body data-shell="title">
    <div id="app"></div>

    <header id="play-hud" hidden>
      <p id="hud-score">0m</p>
      <p id="hud-best">最高 0m</p>
    </header>

    <div id="controls" hidden>
      <button type="button" id="btn-jump">ジャンプ</button>
      <button type="button" id="btn-slide">スライディング</button>
    </div>

    <div id="shell-overlay">
      <section class="panel-card" id="title-card">
        <p class="title-kicker">自動で走る</p>
        <h1>ダッシュランナー</h1>
        <p class="title-lead">操作はジャンプとスライディングだけ。</p>
        <button type="button" id="title-start">はじめる</button>
        <button type="button" id="title-howto">遊び方</button>
      </section>
      <section class="panel-card" id="howto-card" hidden>
        <h2>遊び方</h2>
        <ol class="howto-list">
          <li>キャラクターは自動で走り続けます。</li>
          <li>低い障害はジャンプで飛び越えます。</li>
          <li>高い障害はスライディングでくぐります。</li>
          <li>ぶつかるとその距離が記録されます。</li>
        </ol>
        <p class="hint">キーボードは ↑ / スペース でジャンプ、↓ / S でスライディングです。</p>
        <button type="button" id="howto-close">もどる</button>
      </section>
      <section class="panel-card" id="over-card" hidden>
        <p class="title-kicker">ぶつかった</p>
        <h2>ゲームオーバー</h2>
        <p id="over-score">0m</p>
        <p id="over-best">最高 0m</p>
        <button type="button" id="retry">もういちど</button>
        <button type="button" id="over-title">タイトルへ</button>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
