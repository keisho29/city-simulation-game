<!doctype html>
<html lang="ja">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>都市シミュレーション</title>

    <aside id="hud">

    <nav id="build-menu" aria-label="建築メニュー">
      <button type="button" data-tool="none" class="is-active" aria-pressed="true">

        <span class="tool-swatch" aria-hidden="true"></span>

    <script type="module" src="/src/main.ts"></script>
